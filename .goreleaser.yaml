# Release builds for climan. Run by .github/workflows/release.yml when a
# v* tag is pushed. Check locally with: goreleaser check
version: 2

builds:
  - id: climan
    main: .
    binary: climan
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/jasonli0226/climan/internal/cli.Version={{ .Tag }}

archives:
  - id: climan
    name_template: "climan_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
